name: Deploy Oneshot Arcade to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: builds/*/*/package-lock.json
      - name: Validate catalog
        run: npm run check
      - name: Install and build every game build
        # --keep-going: one model's broken build must not take the whole arcade down.
        # Failed builds still appear on the dashboard, marked "not built".
        run: npm run setup -- --keep-going
      - name: Assemble static arcade site
        run: npm run site
      - name: Publish static site branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf --cached . > /dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name site -exec rm -rf {} +
          cp -R site/. .
          rm -rf site
          git add -A
          git commit -m "Deploy Oneshot Arcade ${GITHUB_SHA}" || true
          git push --force origin HEAD:gh-pages
