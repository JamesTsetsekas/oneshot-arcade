<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--CSP-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Shardfront</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 28,12 22,30 10,30 4,12' fill='%230e1117' stroke='%237ff5e0' stroke-width='2'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #07090d; color: #dfe6ee; font-family: "Segoe UI", system-ui, sans-serif; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; }
      #boot .b { text-align: center; letter-spacing: .18em; }
      #boot .l { font-size: 34px; font-weight: 800; }
      #boot .l span { color: #7ff5e0; }
      #boot .bar { width: 220px; height: 3px; background: #1b222c; margin: 18px auto 0; overflow: hidden; }
      #boot .bar i { display: block; width: 40%; height: 100%; background: #7ff5e0; animation: s 1.1s infinite ease-in-out; }
      @keyframes s { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div id="boot"><div class="b"><div class="l">SHARD<span>FRONT</span></div><div class="bar"><i></i></div><noscript><p>Shardfront requires JavaScript.</p></noscript></div></div>
    <div id="root"></div>
    <script type="module" src="./src/app-shell/main.tsx"></script>
  </body>
</html>
